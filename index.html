<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="imagesgallery.css">
    
</head>
<body>
    <h1 class="ab">My Images Gallery</h1>
    <br>
    <h3 class="pq">CodeAlpha Frontend internship Project</h3>
    <div class="buttons">
        <button onclick="filterImages('all')">All</button>
        <button onclick="filterImages('nature')">Nature</button>
        <button onclick="filterImages('animals')">Animals</button>
        <button onclick="filterImages('flowers')">Flowers</button>
    </div>
    <div class="full-img" id="fullimgbox">
        <img src="https://images.unsplash.com/photo-1794077433317-f1820d132f26?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"id="fullimg" alt="">
       
    </div>
    <div class="image-gallery">
        <img src="https://images.unsplash.com/photo-1794077433317-f1820d132f26?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" onclick="openfullimg(this.src)" data-category="nature">
        <img src="https://plus.unsplash.com/premium_photo-1793811568151-49b68013a38e?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" onclick="openfullimg(this.src)" data-category="nature">
        <img src="https://images.unsplash.com/photo-1793009338356-2a0b879d49d7?q=80&w=464&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" onclick="openfullimg(this.src)" data-category="animals">
        <img src="https://images.unsplash.com/photo-1793523280408-0341741d178a?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" onclick="openfullimg(this.src)"data-category="animals">
        <img src="https://images.unsplash.com/photo-1793278210916-e9a710b44d4b?q=80&w=871&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" onclick="openfullimg(this.src)"data-category="nature">
        <img src="https://images.unsplash.com/photo-1791732978488-f580756a40f7?q=80&w=1374&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" onclick="openfullimg(this.src)"data-category="nature">
        <img src="https://images.unsplash.com/photo-1570949144026-8f8141748760?q=80&w=435&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" onclick="openfullimg(this.src)"data-category="flowers">
        <img src="https://plus.unsplash.com/premium_photo-1669668198777-83b58942af41?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" onclick="openfullimg(this.src)"data-category="flowers">
        <img src="https://plus.unsplash.com/premium_photo-1792236107898-5453743a8e3e?q=80&w=478&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" onclick="openfullimg(this.src)"data-category="nature">
    </div>
    <script>
        var fullimgbox=document.getElementById("fullimgbox");
        var fullimg=document.getElementById("fullimg");
        function openfullimg(pic){
            fullimgbox.style.display="flex";
            fullimg.src=pic;
        }
        function closefullimg(){
            
            fullimgbox.style.display="none";
        }
              function filterImages(category) {
    let images = document.querySelectorAll('img:not(#fullimg)');
    images.forEach(function(img) {
      if (category === 'all' || img.getAttribute('data-category') === category) {
        img.style.display = 'block';
      } else {
        img.style.display = 'none';
      }
    });
  }
        
    </script>
</body>
</html>
